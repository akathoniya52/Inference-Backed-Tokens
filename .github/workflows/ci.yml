name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly devnet end-to-end (only runs when the DEVNET_RPC_URL secret exists).
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MONGOMS_VERSION: 7.0.14
  # Type-aware ESLint across the monorepo needs ~2.2 GB of heap; Node's default limit is lower.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Enable pnpm via corepack
        run: corepack enable && corepack pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache MongoDB binaries (mongodb-memory-server downloads lazily on first test run)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongoms-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm format:check
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build

      - name: Install Playwright Chromium
        run: corepack pnpm --filter @ibt/web exec playwright install --with-deps chromium

      - name: Playwright smoke (public pages, stubbed api; @staging skipped without STAGING_URL)
        run: corepack pnpm --filter @ibt/web e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ibt .

      - name: Version check
        run: docker run --rm ibt node apps/api/dist/main.js --version-check

  nightly-devnet-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEVNET_E2E: '1'
      CLUSTER: devnet
      DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
      RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      MONGODB_URI: mongodb://localhost:27017/ibt?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: corepack pnpm install --frozen-lockfile

      - name: Skip notice
        if: env.DEVNET_RPC_URL == ''
        run: echo "DEVNET_RPC_URL secret is not set; devnet e2e skipped."

      # The script's keys are throwaway and live in memory only; settle:once
      # loads apps/keeper/.env, whose placeholders the script overrides.
      - name: Start mongo and the keeper env file
        if: env.DEVNET_RPC_URL != ''
        run: |
          docker compose up -d --wait mongo
          cp apps/keeper/.env.example apps/keeper/.env

      - name: Devnet e2e (skipped unless the DEVNET_RPC_URL secret is set)
        if: env.DEVNET_RPC_URL != ''
        run: corepack pnpm exec tsx --conditions=development scripts/devnet-e2e.ts
